        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        @keyframes gradientShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes fogFloat { 0% { opacity: 0.3; transform: translateX(-10%) translateY(0); } 25% { opacity: 0.5; transform: translateX(5%) translateY(-20px); } 50% { opacity: 0.35; transform: translateX(10%) translateY(-10px); } 75% { opacity: 0.45; transform: translateX(0%) translateY(-25px); } 100% { opacity: 0.3; transform: translateX(-10%) translateY(0); } }
        @keyframes fogFloat2 { 0% { opacity: 0.2; transform: translateX(5%) translateY(0); } 33% { opacity: 0.4; transform: translateX(-8%) translateY(-15px); } 66% { opacity: 0.25; transform: translateX(3%) translateY(-30px); } 100% { opacity: 0.2; transform: translateX(5%) translateY(0); } }

            cursor: pointer; z-index: 1000; display: flex;

            font-size: 18px; backdrop-filter: blur(10px);

    <script>
        async function uvEncode(url) {
            var encodedUrl = __uv$config.prefix + __uv$config.encodeUrl(url);
            localStorage.setItem("url", encodedUrl);
            window.location.href = "/search";
        }
        async function sjEncode(url) {
            var encodedUrl = "/scram/service/" + encodeURIComponent(url);
            localStorage.setItem("url", encodedUrl);
            window.location.href = "/search";
        }
        async function init() {
            try {
                var connection = new BareMux.BareMuxConnection("/baremux/worker.js");
                var transport = localStorage.getItem("transport") || "libcurl";
                var wispUrl = (location.protocol === "https:" ? "wss" : "ws") + "://" + location.host + "/wisp/";
                var transportPath = transport === "epoxy" ? "/epoxy/index.mjs" : "/libcurl/index.mjs";
                if (await connection.getTransport() !== transportPath) {
                    await connection.setTransport(transportPath, [{ wisp: wispUrl }]);
                }
            } catch (err) {}
            try {
                var ScramjetController = $scramjetLoadController().ScramjetController;
                var scramjet = new ScramjetController({
                    prefix: "/scram/service/",
                    files: { wasm: "/scram/scramjet.wasm.wasm", all: "/scram/scramjet.all.js", sync: "/scram/scramjet.sync.js" },
                    flags: { syncxhr: true }
                });
                await scramjet.init();
            } catch (error) {}
        }
        function resetSiteData() {
            if (confirm("Reset all settings and site data?")) {
                if (window.persistentMusic && !window.persistentMusic.paused) {
                    window.persistentMusic.pause();
                }
                localStorage.clear();
                window.location.reload();
            }
        }

        // PERSISTENT MUSIC PLAYER - Works across all pages
        window.persistentMusic = null;
        
        function initPersistentMusic() {
            var isPlaying = localStorage.getItem('persistentMusicPlaying');
            var musicSrc = localStorage.getItem('persistentMusicSrc');
            var musicVolume = parseFloat(localStorage.getItem('audioVolume') || '0.7');
            var activeAudioData = localStorage.getItem('activeAudioData');
            
            if (isPlaying === 'true' && musicSrc) {
                var audioSrc = musicSrc;
                if (activeAudioData && musicSrc.indexOf('data:') === 0) {
                    audioSrc = activeAudioData;
                }
                
                window.persistentMusic = new Audio(audioSrc);
                window.persistentMusic.loop = true;
                window.persistentMusic.volume = musicVolume;
                
                var savedTime = parseFloat(localStorage.getItem('musicCurrentTime') || '0');
                if (savedTime > 0 && isFinite(savedTime)) {
                    window.persistentMusic.currentTime = savedTime;
                }
                
                window.persistentMusic.addEventListener('timeupdate', function() {
                    localStorage.setItem('musicCurrentTime', window.persistentMusic.currentTime.toString());
                });
                window.persistentMusic.addEventListener('ended', function() {
                    window.persistentMusic.play().catch(function() {});
                });
                
                window.persistentMusic.play().then(function() {
                    updateMusicBtnState(true);
                }).catch(function() {
                    updateMusicBtnState(false);
                });
            } else {
                updateMusicBtnState(false);
            }
        }
        
        function togglePersistentMusic() {
            if (!window.persistentMusic) {
                var musicSrc = localStorage.getItem('persistentMusicSrc');
                var activeAudioData = localStorage.getItem('activeAudioData');
                if (!musicSrc) {
                    alert('No soundtrack applied yet. Go to Settings to choose a track!');
                    return;
                }
                var audioSrc = musicSrc;
                if (activeAudioData && musicSrc.indexOf('data:') === 0) {
                    audioSrc = activeAudioData;
                }
                window.persistentMusic = new Audio(audioSrc);
                window.persistentMusic.loop = true;
                window.persistentMusic.volume = parseFloat(localStorage.getItem('audioVolume') || '0.7');
                
                var savedTime = parseFloat(localStorage.getItem('musicCurrentTime') || '0');
                if (savedTime > 0 && isFinite(savedTime)) {
                    window.persistentMusic.currentTime = savedTime;
                }
                
                window.persistentMusic.addEventListener('timeupdate', function() {
                    localStorage.setItem('musicCurrentTime', window.persistentMusic.currentTime.toString());
                });
                window.persistentMusic.addEventListener('ended', function() {
                    window.persistentMusic.play().catch(function() {});
                });
                
                window.persistentMusic.play().then(function() {
                    localStorage.setItem('persistentMusicPlaying', 'true');
                    updateMusicBtnState(true);
                }).catch(function() {
                    updateMusicBtnState(false);
                });
            } else {
                if (window.persistentMusic.paused) {
                    window.persistentMusic.play().then(function() {
                        localStorage.setItem('persistentMusicPlaying', 'true');
                        updateMusicBtnState(true);
                    }).catch(function() {});
                } else {
                    window.persistentMusic.pause();
                    localStorage.setItem('persistentMusicPlaying', 'false');
                    updateMusicBtnState(false);
                }
            }
        }
        
        function updateMusicBtnState(isPlaying) {
            var btn = document.getElementById('music-btn');
            var tooltip = document.getElementById('music-tooltip');
            var musicName = localStorage.getItem('persistentMusicName') || 'Music';
            if (btn) {
                if (isPlaying) {
                    btn.classList.add('playing');
                    btn.innerHTML = '🎵';
                } else {
                    btn.classList.remove('playing');
                    btn.innerHTML = '🔇';
                }
            }
            if (tooltip) {
                tooltip.textContent = isPlaying ? 'Playing: ' + musicName : 'Music paused';
            }
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            init();
            var defaultBg = '/assets/backgrounds/TwoSwords.png';
            document.body.style.backgroundImage = 'url(\'' + (localStorage.getItem('bg') || defaultBg) + '\')';
            
            var hasSeenIntro = localStorage.getItem('hasSeenIntro');
            var introOverlay = document.getElementById('intro-overlay');
            if (hasSeenIntro) {
                introOverlay.classList.add('hidden-intro');
                document.body.classList.add('intro-done');
                document.body.classList.remove('intro-not-played');
            } else {
                introOverlay.classList.add('playing');
                document.body.classList.add('intro-not-played');
                setTimeout(function() {
                    localStorage.setItem('hasSeenIntro', 'true');
                    introOverlay.classList.add('hidden-intro');
                    document.body.classList.remove('intro-not-played');
                    document.body.classList.add('intro-done');
                }, 4000);
            }
            
            // Init persistent music
            setTimeout(initPersistentMusic, 500);

            var searchInput = document.querySelector('.search-input');
            var searchButton = document.querySelector('.search-button');
            var appButtonsDiv = document.querySelector('.app-buttons');
            var addAppButton = document.getElementById('add-app-button');

            var encodeURL = async function(url) {
                var proxyType = localStorage.getItem('proxy') || 'ultraviolet';
                proxyType === 'ultraviolet' ? await uvEncode(url) : await sjEncode(url);
            };
            
            var handleSearch = async function() {
                var query = searchInput.value.trim();
                if (!query) return;
                var url, isLikelySearch = false;
                try {
                    url = (query.startsWith('http://') || query.startsWith('https://')) ? new URL(query) : new URL('https://' + query);
                    if (!url.hostname || !url.hostname.includes('.')) isLikelySearch = true;
                } catch (e) { isLikelySearch = true; }
                if (isLikelySearch) url = new URL((localStorage.getItem('search') || 'https://www.google.com/search?q=') + query);
                await encodeURL(url.toString());
            };
            
            var createAppButton = function(appName, appUrl) {
                var btn = document.createElement('a');
                btn.href = '#'; btn.classList.add('app-button'); btn.textContent = appName;
                btn.addEventListener('click', function(e) { e.preventDefault(); encodeURL(appUrl); });
                btn.addEventListener('contextmenu', function(e) {
                    e.preventDefault();
                    var idx = apps.findIndex(function(a) { return a.name === btn.textContent; });
                    if (idx > -1) { apps.splice(idx, 1); localStorage.setItem('apps', JSON.stringify(apps)); btn.remove(); }
                });
                return btn;
            };
            
            var apps = JSON.parse(localStorage.getItem('apps') || '[]');
            apps.forEach(function(app) {
                var btn = createAppButton(app.name, app.url);
                appButtonsDiv.insertBefore(btn, addAppButton);
            });

            var addAppModal = document.getElementById('add-app-modal');
            document.getElementById('add-app-cancel').addEventListener('click', function() { addAppModal.style.display = 'none'; });
            document.getElementById('add-app-submit').addEventListener('click', function() {
                var name = document.getElementById('app-name').value;
                var url = document.getElementById('app-url').value;
                if (url && !url.startsWith('http')) url = 'https://' + url;
                if (name && url) {
                    apps.push({ name: name, url: url });
                    localStorage.setItem('apps', JSON.stringify(apps));
                    var btn = createAppButton(name, url);
                    appButtonsDiv.insertBefore(btn, addAppButton);
                    addAppModal.style.display = 'none';
                    document.getElementById('app-name').value = '';
                    document.getElementById('app-url').value = '';
                }
            });
            addAppButton.addEventListener('click', function() { addAppModal.style.display = 'flex'; });
            searchButton.addEventListener('click', handleSearch);
            searchInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') handleSearch(); });
        });
    </script>
</head>

        <div id="add-app-modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);justify-content:center;align-items:center;backdrop-filter:blur(8px);z-index:2000;">
            <div style="padding:28px;border-radius:16px;text-align:center;min-width:300px;background:#141414;border:1px solid rgba(255,255,255,0.1);">
                <h3 style="margin-bottom:16px;color:#dc2626;letter-spacing:2px;">ADD APP</h3>
                <label style="font-size:0.85rem;color:rgba(255,255,255,0.5);display:block;margin-bottom:4px;text-align:left;">App Name</label>
                <input type="text" id="app-name" placeholder="e.g. Netflix" style="width:100%;padding:10px 14px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:#1a1a1a;color:white;outline:none;margin-bottom:12px;box-sizing:border-box;">
                <label style="font-size:0.85rem;color:rgba(255,255,255,0.5);display:block;margin-bottom:4px;text-align:left;">App URL</label>
                <input type="text" id="app-url" placeholder="e.g. netflix.com" style="width:100%;padding:10px 14px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:#1a1a1a;color:white;outline:none;margin-bottom:16px;box-sizing:border-box;">
                <div style="display:flex;gap:8px;">
                    <button id="add-app-submit" style="flex:1;padding:10px;border-radius:8px;border:none;background:#dc2626;color:white;cursor:pointer;font-weight:600;">Add</button>
                    <button id="add-app-cancel" style="flex:1;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.15);background:transparent;color:rgba(255,255,255,0.6);cursor:pointer;">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <button class="reset-button" onclick="resetSiteData()">Reset</button>
    <button class="music-btn" id="music-btn" onclick="togglePersistentMusic()">🎵</button>
    <div class="music-tooltip" id="music-tooltip">Music</div>

    <span class="credit-footer">Made By Hohogames AKA ArenaMasterX</span>

    <%- include('parts/bottombar.ejs') %>
</body>
</html>
